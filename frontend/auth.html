<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voltfix — Account Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="logo">
      <span class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 2 L4 14 H11 L9 22 L20 8 H13 L13 2 Z" fill="currentColor"/>
        </svg>
      </span>
      Voltfix
    </a>
    <nav class="main-nav">
      <a href="index.html" class="nav-back">← Back to Map</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="auth-section">
    <!-- Ambient Radial Glow -->
    <div class="auth-glow" aria-hidden="true"></div>

    <div class="auth-card">
      
      <!-- Card Header -->
      <div class="auth-card-header">
        <p class="eyebrow">Driver & Admin Portal</p>
        <h1 class="auth-title" id="auth-heading">Sign in to your account</h1>
      </div>

      <!-- Segmented Tab Switcher -->
      <div class="auth-tabs" role="tablist">
        <button type = "button" class="auth-tab-btn is-active" id="tab-login" role="tab" aria-selected="true">Sign In</button>
        <button type = "button" class="auth-tab-btn" id="tab-register" role="tab" aria-selected="false">Register</button>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form is-active" novalidate>
        <div class="form-row">
          <label for="login-email">Email Address</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            <input type="email" id="login-email" placeholder="driver@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-row">
          <label for="login-password">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-glow" id="login-btn">
          Sign In
          <svg class="btn-arrow" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
        </button>
        <p class="form-status" id="login-status" aria-live="polite"></p>
      </form>

      <!-- Register Form -->
      <form id="register-form" class="auth-form" novalidate>
        <div class="form-row">
          <label for="reg-name">Full Name</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <input type="text" id="reg-name" placeholder="Alex Morgan" required autocomplete="name">
          </div>
        </div>

        <div class="form-row">
          <label for="reg-email">Email Address</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            <input type="email" id="reg-email" placeholder="driver@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-row">
          <label for="reg-password">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input type="password" id="reg-password" placeholder="Min. 6 characters" minlength="6" required autocomplete="new-password">
          </div>
        </div>

        <div class="form-row role-select-group">
          <label for="reg-role">Account Type</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            <select id="reg-role" name="role">
              <option value="user" selected>driver</option>
              <option value="admin">admin</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-glow" id="reg-btn">
          Create Account
          <svg class="btn-arrow" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
        </button>
        <p class="form-status" id="reg-status" aria-live="polite"></p>
      </form>

    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>

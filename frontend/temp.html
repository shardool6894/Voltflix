<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     
              <!-- Report Item 1 -->
              <div class="queue-item" data-report-id="101">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
                  <div>
                    <strong style="color: var(--text-primary); font-size: 0.95rem;">Metro Station Hub #4</strong>
                    <p style="font-size: 0.8rem; color: var(--accent-fault); margin-top: 2px;">Issue: Connector Latch Damaged</p>
                  </div>
                  <span style="font-family: var(--font-mono); font-size: 0.75rem; color: #64748b;">10m ago</span>
                </div>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 14px;">"Plug 2 handle latch is snapped off. Cable will not lock onto vehicle charging port."</p>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                  <button type="button" class="btn-action-sm btn-action-live" onclick="resolveReport(101, 'available')">Mark Fixed</button>
                  <button type="button" class="btn-action-sm btn-action-fault" onclick="resolveReport(101, 'fault')">Flag Station Fault</button>
                  <button type="button" class="btn-action-sm btn-action-dim" onclick="dismissReport(101)">Dismiss</button>
                </div>
              </div>

</body>
</html>
